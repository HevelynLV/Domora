<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PAUTA · Catálogo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pauta.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="top" style="padding-top: 22px; flex-direction: column; align-items: stretch; gap: 12px">
    <div class="between">
      <div class="stack" style="gap: 0"><span class="small muted">Maré Imóveis</span><h1 class="t1">Catálogo</h1></div>
      <span class="tiny muted">{{total}} imóveis</span>
    </div>
    <div class="field"><label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Buscar por bairro</label><input id="busca" placeholder="Buscar por bairro ou título"></div>
    <div class="chips" role="group" aria-label="Filtrar por tipo">
      <sc-for list="{{tipos}}" as="t" hint-placeholder-count="5">
        <button class="{{t.cls}}" onClick="{{t.pick}}">{{t.nome}}</button>
      </sc-for>
    </div>
    <div class="chips" role="group" aria-label="Filtrar por status">
      <sc-for list="{{status}}" as="s" hint-placeholder-count="3">
        <button class="{{s.cls}}" onClick="{{s.pick}}">{{s.nome}}</button>
      </sc-for>
      <button class="chip"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Preço e quartos</button>
    </div>
  </div>
  <div class="scroll" style="gap: 14px; padding-top: 10px; width: 387px; height: 496px">
    <sc-for list="{{imoveis}}" as="m" hint-placeholder-count="3">
      <a class="card" href="CorImovel.dc.html" style="padding: 0; overflow: hidden; gap: 0">
        <div class="{{m.foto}}" style="height: 150px; border-radius: 0"><span class="{{m.badgeCls}}">{{m.badge}}</span><span>{{m.nFotos}}</span></div>
        <div class="stack" style="padding: 12px 14px 14px; gap: 4px">
          <div class="between"><span class="price" style="font-size: 19px">{{m.preco}}</span><span class="tiny muted">{{m.bairro}}</span></div>
          <b>{{m.titulo}}</b>
          <div class="spec"><span>{{m.q}}</span><span>{{m.v}}</span><span>{{m.a}}</span></div>
        </div>
      </a>
    </sc-for>
    <sc-if value="{{vazio}}" hint-placeholder-val="{{ false }}">
      <p class="p small muted" style="text-align: center; padding: 30px 0">Nenhum imóvel com esses filtros.</p>
    </sc-if>
  </div>
  <nav class="nav" aria-label="Menu do corretor">
    <a class="on" href="CorCatalogo.dc.html" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Catálogo</a>
    <a href="CorNegociacoes.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4M9 13h6M9 17h6"></path></svg>Negociações</a>
    <a href="CorAvisos.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9"></path><path d="M10 20.5h4"></path></svg>Avisos<span class="pill">2</span></a>
    <a href="CorConta.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Conta</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tipo: 'Todos', status: 'Todos' }; }
  renderVals() {
    const dados = [
      { titulo: 'Casa com vista no Campeche', tipo: 'Casa', bairro: 'Campeche', preco: 'R$ 1.890.000', q: '4 quartos', v: '2 vagas', a: '220 m²', neg: false, foto: 'foto', nFotos: '4 fotos' },
      { titulo: 'Apartamento na Beira-Mar Norte', tipo: 'Apartamento', bairro: 'Agronômica', preco: 'R$ 2.450.000', q: '3 quartos', v: '2 vagas', a: '142 m²', neg: true, foto: 'foto f3', nFotos: '9 fotos' },
      { titulo: 'Cobertura em Jurerê Internacional', tipo: 'Cobertura', bairro: 'Jurerê Internacional', preco: 'R$ 4.200.000', q: '4 quartos', v: '3 vagas', a: '310 m²', neg: false, foto: 'foto f2', nFotos: '12 fotos' },
      { titulo: 'Apartamento na Lagoa da Conceição', tipo: 'Apartamento', bairro: 'Lagoa da Conceição', preco: 'R$ 980.000', q: '2 quartos', v: '1 vaga', a: '78 m²', neg: false, foto: 'foto f4', nFotos: '7 fotos' },
      { titulo: 'Casa no Ribeirão da Ilha', tipo: 'Casa', bairro: 'Ribeirão da Ilha', preco: 'R$ 1.150.000', q: '3 quartos', v: '2 vagas', a: '180 m²', neg: true, foto: 'foto f2', nFotos: '6 fotos' }
    ];
    const st = this.state;
    const lista = dados.filter((d) =>
      (st.tipo === 'Todos' || d.tipo === st.tipo) &&
      (st.status === 'Todos' || (st.status === 'Em negociação') === d.neg)
    ).map((d) => ({ ...d, badge: d.neg ? 'Em negociação' : 'Disponível', badgeCls: d.neg ? 'badge b-neg' : 'badge b-disp' }));
    return {
      total: lista.length,
      vazio: lista.length === 0,
      imoveis: lista,
      tipos: ['Todos', 'Casa', 'Apartamento', 'Cobertura', 'Terreno'].map((n) => ({ nome: n, cls: st.tipo === n ? 'chip on' : 'chip', pick: () => this.setState({ tipo: n }) })),
      status: ['Todos', 'Disponível', 'Em negociação'].map((n) => ({ nome: n === 'Todos' ? 'Todos os status' : n, cls: st.status === n ? 'chip on' : 'chip', pick: () => this.setState({ status: n }) }))
    };
  }
}
</script>
</body>
</html>
