<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PAUTA · Assinantes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pauta.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="top" style="padding-top: 22px; flex-direction: column; align-items: stretch; gap: 12px">
    <h1 class="t1">Assinantes</h1>
    <div class="chips" role="group" aria-label="Filtrar assinantes">
      <sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
        <button class="{{f.cls}}" onClick="{{f.pick}}">{{f.nome}}</button>
      </sc-for>
    </div>
  </div>
  <div class="scroll" style="gap: 12px; padding-top: 10px">
    <sc-for list="{{lista}}" as="a" hint-placeholder-count="3">
      <div class="card">
        <div class="between"><b>{{a.nome}}</b><span class="{{a.badgeCls}}">{{a.badge}}</span></div>
        <span class="small muted">{{a.tipo}} · CRECI {{a.creci}}</span>
        <span class="tiny muted">{{a.info}}</span>
        <sc-if value="{{a.pend}}" hint-placeholder-val="{{ false }}">
          <div class="stack" style="gap: 8px">
            <a class="link small" href="#creci">Conferir CRECI no site do CRECI-SC</a>
            <div class="row"><button class="btn perigo sm flex1" onClick="{{a.excluir}}">Excluir</button><button class="btn sm flex1" onClick="{{a.ativar}}">Ativar</button></div>
            <span class="hint">Excluir apaga o cadastro pendente e libera o CRECI para outra conta.</span>
          </div>
        </sc-if>
        <sc-if value="{{a.ativo}}" hint-placeholder-val="{{ false }}">
          <button class="btn perigo sm" onClick="{{a.bloquear}}">Bloquear acesso</button>
        </sc-if>
        <sc-if value="{{a.bloq}}" hint-placeholder-val="{{ false }}">
          <button class="btn sec sm" onClick="{{a.ativar}}">Desbloquear</button>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{vazio}}" hint-placeholder-val="{{ false }}">
      <p class="p small muted" style="text-align: center; padding: 30px 0">Nada aqui.</p>
    </sc-if>
  </div>
  <nav class="nav" aria-label="Menu do admin">
    <a href="AdmPainel.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Painel</a>
    <a href="AdmAprovar.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Imóveis</a>
    <a class="on" href="AdmAssinantes.dc.html" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .6 3.5 2.3 3.5 5.2"></path></svg>Assinantes</a>
    <a href="AdmContratos.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4M9 13l2 2 4-4"></path></svg>Contratos</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filtro: 'pend', st: { mare: 'pend', thiago: 'pend', ilha: 'ativo', sul: 'bloq' } };
  }
  muda(id, s) { this.setState({ st: { ...this.state.st, [id]: s } }); }
  renderVals() {
    const S = this.state.st;
    const base = [
      { id: 'mare', nome: 'Maré Imóveis', tipo: 'Imobiliária', creci: '12345-J SC', info: 'Responsável: Rafael Souza · (48) 99654-2201 · cadastro em 15/10' },
      { id: 'thiago', nome: 'Thiago Lemos', tipo: 'Corretor autônomo', creci: '45678-F SC', info: '(48) 99301-5520 · cadastro em 14/10' },
      { id: 'ilha', nome: 'Ilha Negócios Imobiliários', tipo: 'Imobiliária', creci: '23456-J SC', info: '3 corretores · mensalidade em dia' },
      { id: 'sul', nome: 'Casa Sul Imóveis', tipo: 'Imobiliária', creci: '34567-J SC', info: 'Pagamento vencido desde 05/10 · acesso cortado sozinho' }
    ];
    const rot = { pend: ['Pendente', 'badge b-neg'], ativo: ['Ativa', 'badge b-disp'], bloq: ['Bloqueada', 'badge b-repr'], excl: ['Excluída', 'badge b-pend'] };
    const f = this.state.filtro;
    const lista = base.filter((a) => f === 'todos' || S[a.id] === f).map((a) => ({
      ...a,
      badge: rot[S[a.id]][0], badgeCls: rot[S[a.id]][1],
      pend: S[a.id] === 'pend', ativo: S[a.id] === 'ativo', bloq: S[a.id] === 'bloq',
      ativar: () => this.muda(a.id, 'ativo'),
      bloquear: () => this.muda(a.id, 'bloq'),
      excluir: () => this.muda(a.id, 'excl')
    }));
    const conta = (s) => Object.values(S).filter((x) => x === s).length;
    return {
      lista: lista,
      vazio: lista.length === 0,
      filtros: [['pend', 'Pendentes (' + conta('pend') + ')'], ['ativo', 'Ativos'], ['bloq', 'Bloqueados'], ['todos', 'Todos']].map((x) => ({ nome: x[1], cls: f === x[0] ? 'chip on' : 'chip', pick: () => this.setState({ filtro: x[0] }) }))
    };
  }
}
</script>
</body>
</html>
